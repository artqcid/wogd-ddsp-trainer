[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wogd-ddsp-trainer"
version = "0.1.0"
description = "Web UI training application for DDSP-based speech synthesis models"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = [
    # Core stack. torch/torchaudio are pinned and MUST be installed from the
    # PyTorch CUDA index (`https://download.pytorch.org/whl/cu130`), because the
    # CUDA-enabled cp314 wheels are not published to PyPI (see M1.2 install cmd
    # in doc/implementation/m1-scaffold.md).
    "torch==2.13.0",
    "torchaudio==2.11.0",
    "numpy>=2.2",
    "librosa>=0.11",
    "soundfile>=0.13",
    # F0 extraction: CREPE-PyTorch (torchcrepe, ML primary on GPU) + parselmouth
    # (lightweight CPU fallback for tests/CI/UI preview). See M2.2 + architecture.md.
    "torchcrepe==0.0.24",
    "praat-parselmouth==0.4.7",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery>=5.4",
    "redis>=5.0",
    # M3: TensorBoard metrics (training loop) + ONNX export (model export).
    # onnx has cp314 wheels since 1.22 (unlike neutone_sdk, see BUG-1).
    # onnxscript is required by torch>=2.13's ONNX exporter (imported when
    # torch.onnx.export runs), so it must be a declared runtime dependency.
    "tensorboard>=2.18",
    "onnx>=1.16",
    "onnxscript>=0.7",
    # TOON (Token-Oriented Object Notation): optional serialization of the
    # RAG/MCP search results for LLM consumption (format="toon" output filter)
    # in wogd_ddsp_mcp_server.py. Pure output-side; never touches the RAG DB.
    "python-toon>=0.1.3",
    # NOTE: neutone_sdk is intentionally deferred (not in core deps). It pins
    # numpy<2.3 which has NO cp314 Windows wheel on PyPI -> source build fails on
    # Python 3.14/Windows. Reintroduced in M3.4 (model export). See BUG-<id> in
    # doc/bugs.md and doc/implementation/m1-scaffold.md.
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.setuptools]
packages = [
    "dataset",
    "model",
    "train",
    "inference",
    "server",
    "server.routes",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["."]
# The RAG/MCP tooling server + its `mcp_rag` package are a standalone
# toolchain (not part of the app package) with their own long-line/#noqa
# style; exclude them from lint + format.
exclude = ["wogd_ddsp_mcp_server.py", "mcp_rag"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
